<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Shop - Home</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #e0e5ec;
      color: #2c3e50;
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .animate-header {
      animation: fadeInUp .8s cubic-bezier(.16, 1, .3, 1);
    }

    .animate-banner {
      animation: scaleIn .8s cubic-bezier(.16, 1, .3, 1);
    }

    .animate-search {
      animation: fadeInUp .8s cubic-bezier(.16, 1, .3, 1);
    }

    .animate-section-header {
      animation: fadeInUp .8s cubic-bezier(.16, 1, .3, 1);
    }

    .animate-grid {
      animation: fadeInUp .8s cubic-bezier(.16, 1, .3, 1);
    }

    .animate-footer {
      animation: fadeInUp .8s cubic-bezier(.16, 1, .3, 1);
    }

    .product-card {
      animation: cardPop .55s cubic-bezier(.16, 1, .3, 1) both;
    }

    header {
      background: linear-gradient(145deg, #eef3f8, #d8e2ec);
      padding: 1.4rem 1.2rem;
      text-align: center;
      border-radius: 0 0 35px 35px;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(
        90deg,
        #dc2626,
        #2563eb,
        #10b981,
        #7c3aed,
        #dc2626
      );
      background-size: 400% 400%;
      animation: rainbowBorder 6s ease infinite;
    }

    @keyframes rainbowBorder {
      0%, 100% {
        background-position: 0 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .header-inner-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 900px;
      margin: auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(145deg, #ffffff, #e6ecf5);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 6px 6px 14px #b8bec9,
                  -6px -6px 14px #ffffff;
      border: 1px solid rgba(255, 255, 255, .9);
      flex-shrink: 0;
      transition: transform .3s ease, box-shadow .3s ease;
      padding: 6px;
    }

    .header-logo-box:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px #b8bec9,
                  -8px -8px 18px #ffffff;
    }

    .header-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .08));
    }

    .default-logo-icon {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text-box {
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #siteTitle {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.2px;
      display: block;
      text-transform: capitalize;
      color: #0f172a;
      line-height: 1.2;
    }

    #siteBio {
      font-family: 'Inter', sans-serif;
      font-size: .78rem;
      color: #475569;
      font-weight: 600;
      display: block;
      line-height: 1.3;
      margin-top: 3px;
      letter-spacing: .1px;
    }

    .skeleton-text {
      background: linear-gradient(
        90deg,
        #d8e2ec 25%,
        #eef3f8 50%,
        #d8e2ec 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      color: transparent !important;
      user-select: none;
    }

    .header-user-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .utility-icon-btn {
      position: relative;
      overflow: visible;
      isolation: isolate;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .8);
      background: linear-gradient(145deg, #eef3f8, #d5dde7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      font-size: .95rem;
      cursor: pointer;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      transition: transform .2s ease,
                  box-shadow .2s ease,
                  color .25s ease;
      text-decoration: none;
    }

    .utility-icon-btn:hover {
      transform: translateY(-2px);
      color: #dc2626;
      box-shadow: 10px 10px 20px #b8bec9,
                  -10px -10px 20px #ffffff;
    }

    .utility-icon-btn:active,
    .utility-icon-btn.clicked {
      transform: scale(.91) !important;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff !important;
    }

    .utility-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #dc2626;
      color: #fff;
      font-size: .65rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .utility-badge:empty {
      display: none !important;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 0 1.2rem 2rem;
      flex: 1;
      width: 100%;
    }

    #bannerSection {
      width: 100%;
      max-height: 220px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: .5rem;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      display: none;
    }

    #bannerSection img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .5rem;
      gap: 10px;
      width: 100%;
      background: rgba(224, 229, 236, .6);
      padding: 8px;
      border-radius: 16px;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
    }

    .search-box-wrap {
      flex: 1;
    }

    .search-input-group {
      display: flex;
      align-items: center;
      background: #e0e5ec;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .6);
      transition: all 0.25s ease;
    }

    .search-input-group.focused,
    .search-input-group:focus-within {
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff !important;
      transform: scale(0.995);
    }

    .search-input-group i {
      color: #2563eb;
      margin-right: 10px;
    }

    .search-input-group input {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      font-size: .9rem;
      color: #2c3e50;
    }

    .filter-tabs {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 54px;
      padding: 5px;
      margin-bottom: .5rem;
      background: #e0e5ec;
      border-radius: 16px;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
      overflow: hidden;
      gap: 2px;
    }

    .nav-glider {
      position: absolute;
      top: 5px;
      left: 0;
      height: 44px;
      width: 0;
      border-radius: 13px;
      background: linear-gradient(145deg, #edf3f9, #d7dfe9);
      box-shadow: 7px 7px 14px #b8bec9,
                  -7px -7px 14px #ffffff;
      z-index: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform .35s cubic-bezier(.16, 1, .3, 1),
                  width .35s cubic-bezier(.16, 1, .3, 1);
    }

    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 1 1 0;
      min-width: 0;
      height: 44px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      border: none;
      outline: none;
      border-radius: 13px;
      color: #64748b;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: color .3s ease, transform .2s ease;
    }

    .tab-btn:hover {
      color: #2563eb;
    }

    .tab-btn.active {
      color: #dc2626;
      font-weight: 800;
    }

    .tab-btn:active {
      transform: scale(.95);
    }

    .tab-btn i {
      font-size: .78rem;
      transition: transform .3s ease, color .3s ease;
    }

    .tab-btn:hover i {
      transform: translateY(-1px) scale(1.08);
    }

    .tab-btn.active i {
      transform: scale(1.08);
      color: #dc2626;
    }

    .section-header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      background: linear-gradient(145deg, #e8edf4, #d2dbe6);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      border-left: 5px solid #2563eb;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      color: #1e293b;
      font-weight: 800;
    }

    .section-title i {
      color: #dc2626;
      background: #e0e5ec;
      padding: 8px;
      border-radius: 10px;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
    }

    .see-all-btn {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #eef3f8, #d7dee7);
      border: 1px solid rgba(255, 255, 255, .8);
      color: #2563eb;
      font-weight: bold;
      font-size: .85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 14px;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .see-all-btn:hover {
      transform: translateY(-2px);
    }

    .see-all-btn:active {
      transform: scale(.94);
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .product-card {
      position: relative;
      background: linear-gradient(145deg, #edf3f9, #d8e1eb);
      border-radius: 17px;
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .product-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14px;
      right: 14px;
      height: 3px;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      opacity: .85;
      z-index: 2;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 11px 11px 22px #b8bec9,
                  -11px -11px 22px #ffffff;
    }

    .product-img {
      width: 100%;
      height: 150px;
      background: linear-gradient(145deg, #e9f0f7, #d5dee9);
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c8da3;
      overflow: hidden;
      cursor: pointer;
      padding: 10px;
      border-bottom: 1px solid rgba(37, 99, 235, .10);
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform .35s ease;
    }

    .product-card:hover .product-img img {
      transform: scale(1.035);
    }

    .product-info {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #edf2f7, #dbe4ee);
    }

    .product-title {
      font-size: .95rem;
      margin-bottom: .2rem;
      color: #1e293b;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .product-price {
      font-size: .95rem;
      color: #2563eb;
      font-weight: 800;
      margin-bottom: .8rem;
    }

    .product-price span {
      color: #64748b !important;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
    }

    .neumorphic-btn {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #eef3f8, #d7dee7);
      color: #2563eb;
      font-size: .82rem;
      font-weight: bold;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 14px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      box-shadow: 8px 8px 16px #b8bec9,
                  -8px -8px 16px #ffffff;
      transition: transform .22s cubic-bezier(.2, .8, .2, 1),
                  box-shadow .22s ease,
                  background .3s ease,
                  color .3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .neumorphic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 10px 10px 20px #b8bec9,
                  -10px -10px 20px #ffffff;
    }

    .card-buttons .cart-add-btn {
      background: linear-gradient(145deg, #d9fbe9, #bcefd3) !important;
      color: #16a34a !important;
    }

    .card-buttons .cart-add-btn:hover {
      background: linear-gradient(145deg, #86efac, #4ade80) !important;
      color: #166534 !important;
      transform: translateY(-2px);
      box-shadow: 10px 10px 20px #9fb8a8,
                  -10px -10px 20px #ffffff;
    }

    .card-buttons .neumorphic-btn:not(.cart-add-btn) {
      background: linear-gradient(145deg, #dbeafe, #bfdbfe) !important;
      color: #2563eb !important;
    }

    .card-buttons .neumorphic-btn:not(.cart-add-btn):hover {
      background: linear-gradient(145deg, #93c5fd, #60a5fa) !important;
      color: #1e3a8a !important;
      transform: translateY(-2px);
      box-shadow: 10px 10px 20px #9aaec5,
                  -10px -10px 20px #ffffff;
    }

    .neumorphic-btn:active,
    .neumorphic-btn.clicked {
      transform: scale(.94) translateY(1px) !important;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff !important;
    }

    .disabled-btn {
      background: linear-gradient(145deg, #fee2e2, #fecaca);
      color: #dc2626;
      font-size: .82rem;
      font-weight: bold;
      padding: 9px;
      border: none;
      border-radius: 14px;
      width: 100%;
      text-align: center;
      box-shadow: inset 3px 3px 6px #d1a0a0,
                  inset -3px -3px 6px #ffffff;
      opacity: .95;
    }

    .disabled-btn:hover {
      background: linear-gradient(145deg, #fca5a5, #f87171);
      color: #991b1b;
      transform: translateY(-2px);
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: linear-gradient(145deg, #e6ecf3, #d5dee8);
      box-shadow: 3px 3px 6px #b8bec9,
                  -3px -3px 6px #ffffff;
    }

    .cart-item-info {
      text-align: left;
      flex-grow: 1;
      min-width: 0;
    }

    .cart-item-title {
      font-size: .85rem;
      font-weight: 700;
      color: #1e293b;
      word-break: break-word;
    }

    .cart-item-price {
      font-size: .8rem;
      color: #2563eb;
      font-weight: 800;
    }

    .cart-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: none;
      background: #e0e5ec;
      box-shadow: 3px 3px 6px #b8bec9,
                  -3px -3px 6px #ffffff;
      font-weight: bold;
      color: #2563eb;
      cursor: pointer;
    }

    .qty-btn:active {
      box-shadow: inset 2px 2px 4px #b8bec9,
                  inset -2px -2px 4px #ffffff;
    }

    .cart-remove-btn {
      color: #dc2626;
      background: none;
      border: none;
      font-size: .9rem;
      cursor: pointer;
      padding: 4px;
    }

    footer {
      position: relative;
      background: linear-gradient(145deg, #e8edf4, #d5dde8);
      color: #4a5568;
      padding: 1.5rem 1rem 1rem;
      border-radius: 25px 25px 0 0;
      box-shadow: 0 -8px 20px rgba(100, 116, 139, .25);
      margin-top: auto;
      display: none;
      overflow: hidden;
    }

    footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(
        90deg,
        #dc2626,
        #2563eb,
        #10b981,
        #7c3aed
      );
      background-size: 300% 100%;
      animation: footerGradient 6s linear infinite;
    }

    @keyframes footerGradient {
      0% {
        background-position: 0 50%;
      }

      100% {
        background-position: 300% 50%;
      }
    }

    .footer-container {
      max-width: 800px;
      margin: 0 auto 1rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .footer-card {
      background: linear-gradient(145deg, #edf2f8, #d8e1eb);
      padding: .8rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: 6px 6px 12px #b8bec9,
                  -6px -6px 12px #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .footer-card:hover {
      transform: translateY(-2px);
    }

    .footer-icon-box {
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, #e0e5ec, #d1d7e0);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 3px 3px 6px #b8bec9,
                  inset -3px -3px 6px #ffffff;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .footer-icon-box.icon-location {
      color: #f43f5e;
    }

    .footer-icon-box.icon-phone {
      color: #10b981;
    }

    .footer-icon-box.icon-email {
      color: #2563eb;
    }

    .footer-icon-box.icon-social {
      color: #7c3aed;
    }

    .footer-info h4 {
      font-size: .75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .footer-info p,
    .footer-info a {
      font-size: .85rem;
      color: #1e293b;
      font-weight: 700;
      text-decoration: none;
      word-break: break-all;
    }

    .footer-info a {
      color: #2563eb;
    }

    .footer-bottom {
      text-align: center;
      padding-top: .8rem;
      border-top: 1px solid rgba(100, 116, 139, .15);
      font-size: .75rem;
      color: #64748b;
      font-weight: 600;
    }

    .modal {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(224, 229, 236, 0);

  <script>

    /* =========================================
       FIREBASE
    ========================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyB4t_odwE-4-Xy04VBbftdO4vL3dykK7WE",
      authDomain: "save-9a2b1.firebaseapp.com",
      databaseURL: "https://save-9a2b1-default-rtdb.firebaseio.com",
      projectId: "save-9a2b1",
      storageBucket: "save-9a2b1.firebasestorage.app",
      messagingSenderId: "764677352870",
      appId: "1:764677352870:web:64574453e074a30a843367",
      measurementId: "G-KV0WQWZY0H"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();


    /* =========================================
       DOM
    ========================================= */

    const grid =
      document.getElementById("productsGrid");

    const logoContainer =
      document.getElementById("headerLogoContainer");

    const siteTitleElem =
      document.getElementById("siteTitle");

    const siteBioElem =
      document.getElementById("siteBio");

    const shopFooter =
      document.getElementById("shopFooter");

    const footerContentText =
      document.getElementById("footerContentText");

    const seeAllBtn =
      document.getElementById("seeAllBtn");

    const totalCountSpan =
      document.getElementById("totalCount");

    const cartBadge =
      document.getElementById("cartBadge");

    const bannerSection =
      document.getElementById("bannerSection");

    const bannerImage =
      document.getElementById("bannerImage");

    const searchInput =
      document.getElementById("searchInput");

    const searchInputGroup =
      document.getElementById("searchInputGroup");

    const sectionTitleText =
      document.getElementById("sectionTitleText");

    const sectionHeaderIcon =
      document.getElementById("sectionHeaderIcon");

    const filterTabs =
      document.getElementById("filterTabs");

    const navGlider =
      document.getElementById("navGlider");

    const tabButtons =
      document.querySelectorAll(".tab-btn");


    /* =========================================
       STATE
    ========================================= */

    let globalProducts = [];

    let showAllProducts = false;

    let currentFilter = "all";

    let itemToDeleteId = null;


    /* =========================================
       CART STORAGE
    ========================================= */

    const CART_KEY = "guest_cart";


    function loadCart() {

      try {

        const saved =
          localStorage.getItem(CART_KEY);

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed
          .filter(item =>
            item &&
            item.id !== undefined &&
            item.id !== null
          )
          .map(item => ({
            id: String(item.id),
            name: String(item.name || ""),
            price: String(item.price || ""),
            stock: Math.max(
              0,
              parseInt(item.stock) || 0
            ),
            quantity: Math.max(
              1,
              parseInt(item.quantity) || 1
            )
          }));

      } catch (error) {

        console.error(
          "Cart loading error:",
          error
        );

        return [];
      }
    }


    let cart = loadCart();


    function saveCart() {

      try {

        if (!Array.isArray(cart)) {
          cart = [];
        }

        if (cart.length === 0) {

          localStorage.removeItem(CART_KEY);

          return;
        }

        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );

      } catch (error) {

        console.error(
          "Cart saving error:",
          error
        );
      }
    }


    /* =========================================
       TOAST
    ========================================= */

    function showToast(msg) {

      const toast =
        document.getElementById("toastBox");

      document.getElementById("toastMsg")
        .innerText = msg;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 2500);
    }


    /* =========================================
       CART BADGE
    ========================================= */

    function updateCartBadge() {

      const totalCount =
        cart.reduce(
          (sum, item) =>
            sum + Math.max(
              0,
              parseInt(item.quantity) || 0
            ),
          0
        );

      if (totalCount > 0) {

        cartBadge.innerText =
          totalCount > 99
            ? "99+"
            : totalCount;

        cartBadge.style.display =
          "flex";

      } else {

        cartBadge.innerText = "";

        cartBadge.style.display =
          "none";
      }
    }


    /* =========================================
       PRODUCT FILTER
    ========================================= */

    function isPopularProduct(product) {

      const category =
        String(
          product.category ||
          product.type ||
          ""
        ).toLowerCase();

      const name =
        String(
          product.name || ""
        ).toLowerCase();

      return (
        product.popular === true ||
        product.isPopular === true ||
        category === "popular" ||
        category === "জনপ্রিয়" ||
        category === "জনপ্রিয়" ||
        name.includes("popular") ||
        name.includes("জনপ্রিয়") ||
        name.includes("জনপ্রিয়")
      );
    }


    function isOfferProduct(product) {

      const category =
        String(
          product.category ||
          product.type ||
          ""
        ).toLowerCase();

      const name =
        String(
          product.name || ""
        ).toLowerCase();

      const oldPrice =
        parseFloat(
          product.oldPrice ||
          product.originalPrice ||
          0
        );

      const currentPrice =
        parseFloat(
          String(product.price || "")
            .replace(/[^0-9.]/g, "")
        ) || 0;

      return (
        product.offer === true ||
        product.hasOffer === true ||
        product.discount === true ||
        Number(product.discount) > 0 ||
        (
          oldPrice > 0 &&
          oldPrice > currentPrice
        ) ||
        category === "offer" ||
        category === "অফার" ||
        name.includes("offer") ||
        name.includes("অফার")
      );
    }


    function isNewProduct(product) {

      const category =
        String(
          product.category ||
          product.type ||
          ""
        ).toLowerCase();

      const name =
        String(
          product.name || ""
        ).toLowerCase();

      let isRecent = false;

      if (product.createdAt) {

        const createdDate =
          new Date(
            product.createdAt
          ).getTime();

        const thirtyDays =
          30 * 24 * 60 * 60 * 1000;

        if (
          !isNaN(createdDate) &&
          Date.now() - createdDate <= thirtyDays
        ) {
          isRecent = true;
        }
      }

      return (
        product.new === true ||
        product.isNew === true ||
        isRecent ||
        category === "new" ||
        category === "নতুন" ||
        name.includes("new") ||
        name.includes("নতুন")
      );
    }


    function getFilteredProducts() {

      let products =
        [...globalProducts];

      if (currentFilter === "popular") {

        products =
          products.filter(
            isPopularProduct
          );

      } else if (currentFilter === "offer") {

        products =
          products.filter(
            isOfferProduct
          );

      } else if (currentFilter === "new") {

        products =
          products.filter(
            isNewProduct
          );
      }


      const query =
        searchInput.value
          .toLowerCase()
          .trim();

      if (query) {

        products =
          products.filter(product => {

            const name =
              String(
                product.name || ""
              ).toLowerCase();

            const desc =
              String(
                product.description || ""
              ).toLowerCase();

            return (
              name.includes(query) ||
              desc.includes(query)
            );
          });
      }

      return products;
    }


    /* =========================================
       SAFE HTML
    ========================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================
       PRODUCT BUTTON
    ========================================= */

    function makeProductButton(
      product,
      action
    ) {

      const id =
        escapeHTML(product.id);

      return `
        <button
          type="button"
          class="neumorphic-btn ${
            action === "cart"
              ? "cart-add-btn"
              : ""
          }"
          data-action="${action}"
          data-product-id="${id}"
        >
          <i class="fa-solid ${
            action === "cart"
              ? "fa-cart-plus"
              : "fa-bag-shopping"
          }"></i>
          ${
            action === "cart"
              ? "কার্ট"
              : "অর্ডার"
          }
        </button>
      `;
    }


    /* =========================================
       DISPLAY PRODUCTS
    ========================================= */

    function displayProducts() {

      const filtered =
        getFilteredProducts();

      const list =
        showAllProducts
          ? filtered
          : filtered.slice(0, 4);


      if (list.length === 0) {

        grid.innerHTML = `
          <div style="
            grid-column:1/-1;
            text-align:center;
            color:#64748b;
            padding:2.5rem 1rem;
          ">

            <i class="fa-solid fa-box-open"
               style="
                 font-size:2rem;
                 margin-bottom:.7rem;
                 display:block;
                 opacity:.6;
               ">
            </i>

            কোনো পণ্য পাওয়া যায়নি।

          </div>
        `;

        seeAllBtn.style.display =
          "none";

        return;
      }


      let html = "";


      list.forEach((prod, index) => {

        const id =
          String(prod.id);

        const name =
          String(prod.name || "পণ্য");

        const price =
          String(prod.price || "৳ ০");

        const desc =
          String(
            prod.description ||
            "বিবরণ নেই"
          );

        const image =
          String(
            prod.image || ""
          ).trim();

        const stock =
          Math.max(
            0,
            parseInt(prod.stock) || 0
          );


        let imageHtml = `
          <i class="fa-solid fa-box-open"
             style="
               font-size:2rem;
               color:#a0aec0;
             ">
          </i>
        `;


        if (image) {

          imageHtml = `
            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(name)}"
              onerror="
                this.onerror=null;
                this.parentElement.innerHTML=
                '<i class=&quot;fa-solid fa-box-open&quot; style=&quot;font-size:2rem;color:#a0aec0;&quot;></i>';
              "
            >
          `;
        }


        let actionButtons = "";


        if (stock > 0) {

          actionButtons = `
            <div class="card-buttons">

              ${makeProductButton(
                prod,
                "cart"
              )}

              ${makeProductButton(
                prod,
                "buy"
              )}

            </div>
          `;

        } else {

          actionButtons = `
            <div class="disabled-btn">

              <i class="fa-solid fa-ban"></i>

              স্টক আউট

            </div>

    /* =========================================

    ========================================= */

    function moveNavGlider(button) {

      if (!button || !navGlider) {
        return;
      }

      const left =
        button.offsetLeft;

      const width =
        button.offsetWidth;

      const height =
        button.offsetHeight;

      navGlider.style.width =
        width + "px";

      navGlider.style.height =
        height + "px";

      navGlider.style.transform =
        `translateX(${left}px)`;
    }


    function centerActiveTab(button) {

      if (!button) return;

      const containerWidth =
        filterTabs.clientWidth;

      const buttonLeft =
        button.offsetLeft;

      const buttonWidth =
        button.offsetWidth;

      const targetScroll =
        buttonLeft -
        containerWidth / 2 +
        buttonWidth / 2;


      if (
        filterTabs.scrollWidth >
        filterTabs.clientWidth
      ) {

        filterTabs.scrollTo({
          left: Math.max(
            0,
            targetScroll
          ),
          behavior: "smooth"
        });
      }
    }

      if (!button) return;

      const newFilter =

    /* =========================================
       ADD PRODUCT TO CART
    ========================================= */

    function addProductToCart(
      product
    ) {

      if (!product) {

        showToast(
          "পণ্য পাওয়া যায়নি!"
        );

        return;
      }


      const id =
        String(product.id);

      const name =
        String(product.name || "পণ্য");

      const price =
        String(product.price || "");

      const stock =
        Math.max(
          0,
          parseInt(product.stock) || 0
        );


      if (stock <= 0) {

        showToast(
          "পণ্যটি স্টক আউট!"
        );

        return;
      }


      let existing =
        cart.find(
          item =>
            String(item.id) ===
            id
        );


      if (existing) {

        const currentQty =
          Math.max(
            1,
            parseInt(
              existing.quantity
            ) || 1
          );


        if (
          currentQty >= stock
        ) {

          showToast(
            "স্টকের অতিরিক্ত যোগ করা সম্ভব নয়!"
          );

          return;
        }


        existing.quantity =
          currentQty + 1;

        existing.stock =
          stock;

        existing.name =
          name;

        existing.price =
          price;


        showToast(
          "কার্টে পণ্যের সংখ্যা বাড়ানো হয়েছে!"
        );

      } else {

        cart.push({

          id: id,

          name: name,

          price: price,

          stock: stock,

          quantity: 1

        });


        showToast(
          "কার্টে পণ্য যুক্ত করা হয়েছে!"
        );
      }


      saveCart();
      updateCartBadge();
      renderCartModalItems();
    }


    function addToCart(
      id,
      name,
      price,
      stock
    ) {

      addProductToCart({

        id: id,

        name: name,

        price: price,

        stock: stock

      });
    }

    /* =========================================
       CHANGE QUANTITY
    ========================================= */

    function changeQuantity(
      id,
      amount
    ) {

      const item =
        cart.find(
          i =>
            String(i.id) ===
            String(id)
        );


      if (!item) {
        return;
      }


      const current =
        Math.max(
          1,
          parseInt(
            item.quantity
          ) || 1
        );


      const stock =
        Math.max(
          0,
          parseInt(
            item.stock
          ) || 0
        );


      const newQuantity =
        current + amount;


      if (newQuantity <= 0) {

        confirmRemoveFromCart(
          id
        );

        return;
      }


      if (
        stock > 0 &&
        newQuantity > stock
      ) {

        item.quantity =
          stock;

        showToast(
          "স্টকের বেশি যোগ করা যাবে না!"
        );

      } else if (
        stock <= 0
      ) {

        showToast(
          "পণ্যটি বর্তমানে স্টক আউট!"
        );

        return;

      } else {

        item.quantity =
          newQuantity;
      }


      saveCart();
      updateCartBadge();
      renderCartModalItems();
    }

    /* =========================================
       LIVE PRODUCTS / LIVE STOCK
    ========================================= */

    function updateProductsFromFirebase(
      productsData
    ) {

      if (
        !productsData ||
        typeof productsData !== "object"
      ) {

        globalProducts = [];

        displayProducts();

        renderCartModalItems();

        updateCartBadge();

        return;
      }


      globalProducts =
        Object.keys(
          productsData
        ).map(key => {

          const product =
            productsData[key];

          return {

            id: key,

            ...(product || {})

          };

        });


      let cartUpdated = false;

      cart.forEach(cartItem => {

        const latest =
          globalProducts.find(
            product =>
              String(product.id) ===
              String(cartItem.id)
          );


        if (!latest) {
          return;
        }

        const newName = String(latest.name || cartItem.name || "পণ্য");
        const newPrice = String(latest.price || cartItem.price || "");
        const newStock = Math.max(0, parseInt(latest.stock) || 0);

        if (cartItem.name !== newName || cartItem.price !== newPrice || cartItem.stock !== newStock) {
          cartItem.name = newName;
          cartItem.price = newPrice;
          cartItem.stock = newStock;
          cartUpdated = true;
        }

        if (
          newStock > 0 &&
          Number(cartItem.quantity) >
          newStock
        ) {

          cartItem.quantity =
            newStock;
          cartUpdated = true;
        }

      });


      const initialCartLength = cart.length;
      cart = cart.filter(cartItem => {

        const latest =
          globalProducts.find(
            product =>
              String(product.id) ===
              String(cartItem.id)
          );


        if (!latest) {
          return true;
        }


        const latestStock =
          Math.max(
            0,
            parseInt(
              latest.stock
            ) || 0
          );


        if (latestStock <= 0) {

          return false;
        }


        return true;
      });

      if (cart.length !== initialCartLength) {
        cartUpdated = true;
      }

      if (cartUpdated) {
        saveCart();
      }

      displayProducts();

      renderCartModalItems();

      updateCartBadge();

      initializeNavGlider();
    }


    /* =========================================
       CACHE (লোকালস্টোরেজ কেসিং সিস্টেম)
    ========================================= */

    const CACHE_KEY =
      "shop_data_cache";

    const CACHE_TIME_KEY =
      "shop_data_cache_time";

    const CACHE_DURATION =
      5 * 60 * 1000;


    function initDataFetching() {

      const cachedData =
        localStorage.getItem(
          CACHE_KEY
        );

      const cachedTime =
        localStorage.getItem(
          CACHE_TIME_KEY
        );

      const now =
        Date.now();


      if (
        cachedData &&
        cachedTime &&
        now - Number(cachedTime) <
        CACHE_DURATION
      ) {

        try {

          const parsed =
            JSON.parse(
              cachedData
            );

          renderShopUI(
            parsed
          );

        } catch (error) {

          console.error(
            "Cache parse error:",
            error
          );
        }
      }


      db.ref("shopData")
        .on(
          "value",
          snapshot => {

            const data =
              snapshot.val();


            if (!data) {
              return;
            }


            try {

              localStorage.setItem(
                CACHE_KEY,
                JSON.stringify(data)
              );

              localStorage.setItem(
                CACHE_TIME_KEY,
                String(Date.now())
              );

            } catch (error) {

              console.error(
                "Cache save error:",
                error
              );
            }


            renderShopUI(
              data
            );

          },
          error => {

            console.error(
              "Firebase shopData read error:",
              error
            );

            showToast(
              "ডেটা লোড করতে সমস্যা হয়েছে!"
            );

          }
        );


      db.ref("products")
        .on(
          "value",
          snapshot => {

            const products =
              snapshot.val();

            updateProductsFromFirebase(
              products
            );

          },
          error => {

            console.error(
              "Firebase products read error:",
              error
            );

            showToast(
              "পণ্যের stock আপডেট পড়তে সমস্যা হয়েছে!"
            );

          }
        );
    }


    /* =========================================
       OUTSIDE CLICK MODAL CLOSE
    ========================================= */

    document.querySelectorAll(
      ".modal"
    ).forEach(modal => {

      modal.addEventListener(
        "click",
        function(event) {

          if (
            event.target === modal
          ) {

            modal.classList.remove(
              "active"
            );
          }

        }
      );

    });


    /* =========================================
       INIT
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        initializeNavGlider();

        updateCartBadge();

        renderCartModalItems();

        initDataFetching();

      }
    );

  </script>

</body>
</html>
